# Ultimate AI Agent Sandbox Docker Compose (Ubuntu 26.04 LTS + Full Persistence + Healthchecks + Profiles)
# Skeptic-audited August 2026 — all images verified latest stable
# Hardware Profile: AMD Ryzen 5 5500 (10 Threads Allocated), 48GB Host RAM (25GB Allocated)

services:
  # ── Primary Multi-Agent Sandbox Container ──
  devbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.devbox
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
        PHP_VERSION: ${PHP_VERSION:-8.5}
        JAVA_VERSION: ${JAVA_VERSION:-21}
        INSTALL_AI_AGENTS: ${ENABLE_AI_AGENTS:-true}
        INSTALL_FLUTTER_ANDROID: ${ENABLE_FLUTTER_ANDROID:-true}
        INSTALL_EXPO: ${ENABLE_EXPO:-true}
        INSTALL_FASTLANE: ${ENABLE_FASTLANE:-true}
        INSTALL_KOTLIN: ${ENABLE_KOTLIN:-true}
        INSTALL_LIGHTHOUSE: ${ENABLE_LIGHTHOUSE:-true}
        INSTALL_WATCHMAN: ${ENABLE_WATCHMAN:-true}
        INSTALL_PLAYWRIGHT: ${ENABLE_PLAYWRIGHT:-true}
        INSTALL_PHP: ${ENABLE_PHP:-true}
        INSTALL_DEV_TOOLS: ${ENABLE_DEV_TOOLS:-true}
        INSTALL_FIREBASE: ${ENABLE_FIREBASE:-true}
        INSTALL_COMPOSER: ${ENABLE_COMPOSER:-true}
        INSTALL_BUN: ${ENABLE_BUN:-true}
        INSTALL_UV: ${ENABLE_UV:-true}
        INSTALL_RUST: ${ENABLE_RUST:-true}
        INSTALL_GO: ${ENABLE_GO:-false}
        INSTALL_DENO: ${ENABLE_DENO:-false}
        INSTALL_CPP_TOOLCHAIN: ${ENABLE_CPP_TOOLCHAIN:-false}
        INSTALL_ZSH: ${ENABLE_ZSH:-true}
        INSTALL_FISH: ${ENABLE_FISH:-false}
        INSTALL_VSCODE_WEB: ${ENABLE_VSCODE_WEB:-true}
        INSTALL_VSCODIUM_WEB: ${ENABLE_VSCODIUM_WEB:-true}
        INSTALL_NEOVIM: ${ENABLE_NEOVIM:-true}
        INSTALL_MICRO: ${ENABLE_MICRO:-true}
        INSTALL_HELIX: ${ENABLE_HELIX:-false}
        INSTALL_WEB_TOOLING: ${ENABLE_WEB_TOOLING:-true}
        INSTALL_POSTGRES_CLIENT: ${ENABLE_POSTGRES_CLIENT:-true}
    container_name: devbox
    hostname: devbox
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-8081}:8081"           # Agent Server daemon
      - "${VSCODIUM_PORT:-8084}:8084"       # VSCodium Web (open-vsx Telemetry-Free)
      - "${VSCODE_PORT:-8085}:8085"         # VS Code Web (code-server)
      - "${GUI_NOVNC_PORT:-6080}:6080"      # noVNC Web Browser GUI Viewer
      - "${FIREBASE_UI_PORT:-4000}:4000"    # Firebase Emulator Suite UI
      - "9099:9099"                         # Firebase Auth Emulator
      - "8082:8082"                         # Firebase Firestore Emulator
      - "9000:9000"                         # Firebase Realtime DB Emulator
      - "5001:5001"                         # Firebase Functions Emulator
      - "5000:5000"                         # Firebase Hosting Emulator
    environment:
      - NODE_ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - KILO_API_KEY=${KILO_API_KEY:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - DEVIN_API_KEY=${DEVIN_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - CURSOR_API_KEY=${CURSOR_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - FIREBASE_TOKEN=${FIREBASE_TOKEN:-}
      - VERCEL_TOKEN=${VERCEL_TOKEN:-}
      - NETLIFY_AUTH_TOKEN=${NETLIFY_AUTH_TOKEN:-}
      - SUPABASE_ACCESS_TOKEN=${SUPABASE_ACCESS_TOKEN:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - MYSQL_HOST=mysql-db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secret}
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - ANDROID_HOME=/opt/android-sdk
      - FLUTTER_HOME=/opt/flutter
      - CHROME_BIN=/usr/bin/chromium-browser
      - DISPLAY=:99
    volumes:
      # 1. Project code workspace (Host folder mount)
      - ./workspace:/workspace:rw
      # 2. Agent Configuration
      - ./devbox_config:/home/agent/.kilo:rw
      # 3. Persistent User Home Directory (bash history, git config, dotfiles)
      - agent_home:/home/agent:rw
      # 4. Persistent SSH Keys
      - agent_ssh:/home/agent/.ssh:rw
      # 5. Persistent VS Code Web Configuration & Settings
      - vscode_data:/home/agent/.config/code-server:rw
      # 6. Persistent VS Code Web Installed Extensions
      - vscode_extensions:/home/agent/.local/share/code-server:rw
      # 7. Persistent Firebase Configstore Login Credentials
      - firebase_config:/home/agent/.config/configstore:rw
      # 8. Persistent NPM / PNPM / Bun Cache
      - npm_cache:/home/agent/.npm:rw
      # 9. Persistent Python / Pip / UV Cache
      - pip_cache:/home/agent/.cache:rw
      # 10. Persistent PHP Composer Cache
      - composer_cache:/home/agent/.cache/composer:rw
      # 11. Persistent Android SDK & Gradle cache
      - android_cache:/home/agent/.android:rw
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-10}'         # Ryzen 5 5500 (10 threads)
          memory: ${MEMORY_LIMIT:-25G}     # 25GB RAM allocation
    networks:
      - devbox-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Redis / KeyDB In-Memory Cache Service ──
  redis-cache:
    image: ${REDIS_ENGINE_IMAGE:-redis:8-alpine}
    container_name: redis-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data:rw
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - devbox-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis Commander Visual Web UI ──
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: unless-stopped
    ports:
      - "${REDIS_UI_PORT:-8087}:8081"
    environment:
      - REDIS_HOSTS=local:redis-cache:6379
    networks:
      - devbox-net
    depends_on:
      redis-cache:
        condition: service_healthy

  # ── Relational Database Container (MySQL 8.4 LTS default / MariaDB 11.4 LTS) ──
  mysql-db:
    image: ${DB_ENGINE_IMAGE:-mysql:8.4}
    container_name: mysql-db
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sandbox_db}
    volumes:
      - mysql_data:/var/lib/mysql:rw
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - devbox-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── phpMyAdmin Visual Web Management for MySQL / MariaDB ──
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8086}:80"
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
    networks:
      - devbox-net
    depends_on:
      mysql-db:
        condition: service_healthy

  # ── PostgreSQL 17 Relational Database Container (Optional Service) ──
  postgres-db:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-sandbox_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - devbox-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── pgAdmin 4 Visual Web Management for PostgreSQL ──
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8088}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sandbox.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-secret}
    volumes:
      - pgadmin_data:/var/lib/pgadmin:rw
    networks:
      - devbox-net
    depends_on:
      postgres-db:
        condition: service_healthy

  # ── MongoDB 8 NoSQL Document Database Container (Optional Service) ──
  mongo-db:
    image: mongo:8.0
    container_name: mongo-db
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret}
    volumes:
      - mongo_data:/data/db:rw
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - devbox-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Mongo Express Visual Web Management for MongoDB ──
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "${ME_PORT:-8089}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-secret}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-secret}@mongo-db:27017/
      ME_CONFIG_BASICAUTH: "false"
    networks:
      - devbox-net
    depends_on:
      mongo-db:
        condition: service_healthy

networks:
  devbox-net:
    driver: bridge
    name: devbox-net

volumes:
  agent_home:
    driver: local
  agent_ssh:
    driver: local
  vscode_data:
    driver: local
  vscode_extensions:
    driver: local
  firebase_config:
    driver: local
  npm_cache:
    driver: local
  pip_cache:
    driver: local
  composer_cache:
    driver: local
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  mongo_data:
    driver: local
  redis_data:
    driver: local
  android_cache:
    driver: local
